<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的线上网页</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
        }
        .header {
            background: #2468eb;
            color: #fff;
            text-align: center;
            padding: 60px 20px;
        }
        .header h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }
        .content {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .content p {
            line-height: 1.8;
            color: #555;
            font-size: 16px;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>欢迎访问我的线上网页</h1>
        <p>部署完成，输入网址即可访问</p>
    </div>

    <div class="content">
        <h2>页面介绍</h2>
        <p>这是部署在 GitHub Pages 的免费网页，所有资源联网加载，手机、电脑都能正常打开。</p>
    </div>

    <footer>
        © 2026 免费静态网页
    </footer>
</body>
</html>
