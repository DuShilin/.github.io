<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作任务跟踪记录器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #409eff;
      --primary-light: #ecf5ff;
      --success: #67c23a;
      --warning: #e6a23c;
      --info: #909399;
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #303133;
      --text-light: #606266;
      --border: #ebeef5;
      --shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }
    .dark {
      --primary: #66b1ff;
      --primary-light: #1f2d3d;
      --bg: #1a1d23;
      --card: #252a34;
      --text: #e5eaf3;
      --text-light: #a3a6ad;
      --border: #3a3f48;
      --shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.2);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", system-ui, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      transition: all 0.3s ease;
      line-height: 1.6;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 20px;
      cursor: pointer;
      overflow: hidden;
      border: 2px solid var(--primary);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    header h2 {
      color: var(--primary);
      font-weight: 600;
      font-size: 24px;
    }
    .btn {
      padding: 9px 18px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(64, 158, 255, 0.3);
    }
    .btn:hover {
      background-color: #66b1ff;
      transform: translateY(-2px);
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }
    .card:hover {
      box-shadow: 0 4px 18px 0 rgba(0, 0, 0, 0.1);
    }
    .card h3 {
      margin-bottom: 16px;
      color: var(--text);
      font-size: 18px;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }
    input, select {
      width: 100%;
      padding: 11px 14px;
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--card);
      color: var(--text);
      font-size: 14px;
      transition: border 0.2s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 12px 8px;
      text-align: center;
    }
    th {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 500;
    }
    tr:hover {
      background-color: var(--primary-light);
    }
    .page {
      max-width: 440px;
      margin: 70px auto;
      display: none;
    }
    .page.active {
      display: block;
    }
    .pwd-box {
      position: relative;
    }
    .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 16px;
      cursor: pointer;
      color: var(--info);
      font-size: 16px;
      user-select: none;
    }
    .link {
      color: var(--primary);
      cursor: pointer;
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      transition: color 0.2s;
    }
    .link:hover {
      color: #66b1ff;
      text-decoration: underline;
    }
    .tips {
      font-size: 12px;
      color: var(--text-light);
      margin: 4px 0 8px;
    }
    .hidden {
      display: none !important;
    }
    .chart-container {
      height: 320px;
      margin: 20px 0 10px;
    }
    /* 个人中心头像上传 */
    .center-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 40px;
      margin: 0 auto 16px;
      overflow: hidden;
      border: 3px solid var(--primary);
      cursor: pointer;
    }
    .center-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #avatarInput {
      display: none;
    }
  </style>
</head>

<body>
<div class="container">
  <header>
    <div class="header-left">
      <div class="avatar" id="headerAvatar" onclick="goPage('profilePage')">
        👤
      </div>
      <h2>工作任务跟踪记录器</h2>
    </div>
    <div>
      <button id="toggleTheme" class="btn">切换主题</button>
      <button id="logoutBtn" class="btn hidden">退出登录</button>
    </div>
  </header>

  <!-- 登录页面 -->
  <div id="loginPage" class="page card active">
    <h2 style="text-align:center;margin-bottom:24px;color:var(--primary);">账号登录</h2>
    <input id="loginPhone" placeholder="请输入注册手机号" maxlength="11">
    <div class="pwd-box">
      <input id="loginPwd" type="password" placeholder="请输入登录密码">
      <span class="toggle-pwd" onclick="togglePwd('loginPwd')">👁️</span>
    </div>
    <button class="btn" style="width:100%;margin-top:10px;" onclick="login()">立即登录</button>
    <div class="link" onclick="goPage('findPage')">忘记密码？</div>
    <div class="link" onclick="goPage('regPage')">没有账号，前往注册</div>
  </div>

  <!-- 注册页面 -->
  <div id="regPage" class="page card">
    <h2 style="text-align:center;margin-bottom:24px;color:var(--primary);">新用户注册</h2>
    <input id="regPhone" placeholder="请设置登录手机号" maxlength="11">
    <div class="pwd-box">
      <input id="regPwd" type="password" placeholder="设置登录密码">
      <span class="toggle-pwd" onclick="togglePwd('regPwd')">👁️</span>
    </div>
    <div class="pwd-box">
      <input id="regPwd2" type="password" placeholder="再次确认密码">
      <span class="toggle-pwd" onclick="togglePwd('regPwd2')">👁️</span>
    </div>
    <select id="question">
      <option>你的生日是？</option>
      <option>你的小学名称是？</option>
      <option>你的母亲姓名是？</option>
    </select>
    <input id="answer" placeholder="请输入密保答案">
    <button class="btn" style="width:100%;margin-top:10px;" onclick="register()">完成注册</button>
    <div class="link" onclick="goPage('loginPage')">已有账号，返回登录</div>
  </div>

  <!-- 找回密码 -->
  <div id="findPage" class="page card">
    <h2 style="text-align:center;margin-bottom:24px;color:var(--primary);">找回密码</h2>
    <input id="findPhone" placeholder="请输入注册手机号" maxlength="11">
    <select id="findQuestion">
      <option>你的生日是？</option>
      <option>你的小学名称是？</option>
      <option>你的母亲姓名是？</option>
    </select>
    <input id="findAnswer" placeholder="请输入密保答案">
    <button class="btn" style="width:100%;margin-top:10px;" onclick="findPwd()">验证找回密码</button>
    <div id="showPwd" class="link" style="color:#f56c6c;font-weight:500;"></div>
    <div class="link" onclick="goPage('loginPage')">返回登录</div>
  </div>

  <!-- 个人中心（头像+修改手机号） -->
  <div id="profilePage" class="page card">
    <h2 style="text-align:center;margin-bottom:24px;color:var(--primary);">个人中心</h2>
    <div class="center-avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()">
      👤
    </div>
    <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(event)">
    <p style="text-align:center;color:var(--text-light);font-size:12px;margin-bottom:16px;">点击头像更换</p>

    <input id="curPhone" readonly style="background:var(--primary-light);" placeholder="当前手机号">
    <input id="newPhone" placeholder="新手机号" maxlength="11">
    <button class="btn" style="width:100%;margin-top:10px;" onclick="changePhone()">保存修改</button>
    <div class="link" onclick="goPage('mainPage')">返回首页</div>
  </div>

  <!-- 主功能页面 -->
  <div id="mainPage" class="hidden">
    <div class="card">
      <h3>新增任务</h3>
      <input id="no" placeholder="任务序号">
      <input id="name" placeholder="任务名称">
      <input id="start" type="datetime-local">
      <input id="end" type="datetime-local">
      <input id="user" placeholder="对接人">
      <select id="status">
        <option>进行中</option>
        <option>已完成</option>
        <option>待反馈</option>
      </select>
      <button class="btn" style="width:100%;margin-top:10px;" onclick="addTask()">保存任务</button>
    </div>

    <div class="card">
      <h3>任务列表</h3>
      <table>
        <thead>
          <tr>
            <th>序号</th>
            <th>任务名称</th>
            <th>开始时间</th>
            <th>截至时间</th>
            <th>对接人</th>
            <th>任务状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="taskList"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>月度任务统计</h3>
      <input type="month" id="month" onchange="drawChart()">
      <div class="chart-container">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
  let user = null;
  let users = JSON.parse(localStorage.getItem('users')) || [];
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  let chartInstance = null;

  // 手机号格式校验
  function checkPhone(phone) {
    return /^1[3-9]\d{10}$/.test(phone);
  }

  // 切换页面
  function goPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('showPwd').innerText = '';

    // 个人中心：回填当前手机号
    if (id === 'profilePage' && user) {
      const u = users.find(x => x.phone === user);
      if (u) {
        curPhone.value = u.phone;
        // 回填头像
        if (u.avatar) {
          profileAvatar.innerHTML = `<img src="${u.avatar}">`;
          headerAvatar.innerHTML = `<img src="${u.avatar}">`;
        } else {
          profileAvatar.innerText = '👤';
          headerAvatar.innerText = '👤';
        }
      }
    }
  }

  // 密码显示/隐藏切换
  function togglePwd(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  // 深浅主题切换
  document.getElementById('toggleTheme').onclick = () => {
    document.body.classList.toggle('dark');
  };

  // 注册
  function register() {
    const phone = regPhone.value.trim();
    const pwd = regPwd.value.trim();
    const pwd2 = regPwd2.value.trim();
    const q = question.value;
    const a = answer.value.trim();

    if (!checkPhone(phone)) {
      return alert('请输入正确的11位手机号');
    }
    if (!pwd || !pwd2 || !a) {
      return alert('请填写完整所有信息');
    }
    if (pwd !== pwd2) {
      return alert('两次输入的密码不一致');
    }
    if (users.find(item => item.phone === phone)) {
      return alert('该手机号已注册，请直接登录');
    }

    users.push({
      phone: phone,
      pwd: pwd,
      question: q,
      answer: a,
      avatar: ''
    });
    localStorage.setItem('users', JSON.stringify(users));
    alert('注册成功！请前往登录');
    goPage('loginPage');
  }

  // 登录
  function login() {
    const phone = loginPhone.value.trim();
    const pwd = loginPwd.value.trim();

    if (!checkPhone(phone)) {
      return alert('请输入正确的11位手机号');
    }
    const findUser = users.find(item => item.phone === phone && item.pwd === pwd);
    if (!findUser) {
      return alert('手机号或密码错误');
    }

    user = phone;
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    mainPage.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');

    // 登录后显示头像
    if (findUser.avatar) {
      headerAvatar.innerHTML = `<img src="${findUser.avatar}">`;
    } else {
      headerAvatar.innerText = '👤';
    }

    renderList();
    drawChart();
  }

  // 找回密码
  function findPwd() {
    const phone = findPhone.value.trim();
    const q = findQuestion.value;
    const a = findAnswer.value.trim();

    if (!checkPhone(phone)) {
      return alert('请输入正确的11位手机号');
    }
    const findUser = users.find(item =>
      item.phone === phone && item.question === q && item.answer === a
    );
    if (!findUser) {
      showPwd.innerText = '';
      return alert('手机号或密保答案不正确，验证失败');
    }
    showPwd.innerText = `验证通过，您的密码：${findUser.pwd}`;
  }

  // 退出登录
  document.getElementById('logoutBtn').onclick = () => {
    location.reload();
  };

  // 新增任务
  function addTask() {
    const task = {
      no: no.value.trim(),
      name: name.value.trim(),
      start: start.value,
      end: end.value,
      user: user.value.trim(),
      status: status.value,
      month: new Date().toISOString().slice(0, 7)
    };
    tasks.push(task);
    localStorage.setItem('tasks', JSON.stringify(tasks));
    renderList();
    drawChart();
    alert('任务添加成功');
  }

  // 渲染任务列表
  function renderList() {
    taskList.innerHTML = '';
    tasks.forEach((t, idx) => {
      taskList.innerHTML += `
      <tr>
        <td>${t.no}</td>
        <td>${t.name}</td>
        <td>${t.start || ''}</td>
        <td>${t.end || ''}</td>
        <td>${t.user}</td>
        <td>${t.status}</td>
        <td><button class="btn" style="padding:5px 10px;font-size:12px;" onclick="del(${idx})">删除</button></td>
      </tr>`;
    });
  }

  // 删除任务
  function del(idx) {
    if (!confirm('确定要删除该任务吗？')) return;
    tasks.splice(idx, 1);
    localStorage.setItem('tasks', JSON.stringify(tasks));
    renderList();
    drawChart();
  }

  // 绘制月度统计图表
  function drawChart() {
    const m = month.value || new Date().toISOString().slice(0, 7);
    const list = tasks.filter(t => t.month === m);
    const res = { 进行中: 0, 已完成: 0, 待反馈: 0 };
    list.forEach(t => res[t.status]++);

    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('chart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['进行中', '已完成', '待反馈'],
        datasets: [{
          label: '任务数量',
          data: [res.进行中, res.已完成, res.待反馈],
          backgroundColor: ['#e6a23c', '#67c23a', '#409eff'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  // 头像上传预览
  function uploadAvatar(e) {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('image/')) {
      return alert('请选择图片文件');
    }
    const reader = new FileReader();
    reader.onload = function (ev) {
      const base64 = ev.target.result;
      profileAvatar.innerHTML = `<img src="${base64}">`;
      headerAvatar.innerHTML = `<img src="${base64}">`;
      // 保存到用户数据
      const u = users.find(x => x.phone === user);
      if (u) {
        u.avatar = base64;
        localStorage.setItem('users', JSON.stringify(users));
      }
    };
    reader.readAsDataURL(file);
  }

  // 修改手机号
  function changePhone() {
    const oldPhone = user;
    const newPhone = newPhone.value.trim();
    if (!checkPhone(newPhone)) {
      return alert('请输入正确的11位新手机号');
    }
    if (newPhone === oldPhone) {
      return alert('新手机号不能和当前手机号相同');
    }
    if (users.find(x => x.phone === newPhone)) {
      return alert('该手机号已被其他账号使用');
    }
    // 更新
    const u = users.find(x => x.phone === oldPhone);
    if (u) {
      u.phone = newPhone;
      user = newPhone;
      localStorage.setItem('users', JSON.stringify(users));
      alert('手机号修改成功！');
      goPage('profilePage');
    }
  }
</script>
</body>
</html>
