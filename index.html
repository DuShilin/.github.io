<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作任务跟踪记录器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #fff;
      --card: #f9fafb;
      --text: #111827;
      --border: #e5e7eb;
      --blue: #2563eb;
    }
    .dark {
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --border: #374151;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: 0.3s;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn {
      padding: 8px 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 6px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: center;
    }

    /* 登录注册页面 */
    .page {
      max-width: 420px;
      margin: 60px auto;
      display: none;
    }
    .page.active {
      display: block;
    }
    .pwd-box {
      position: relative;
    }
    .toggle-pwd {
      position: absolute;
      right: 10px;
      top: 12px;
      cursor: pointer;
      color: #666;
    }
    .link {
      color: var(--blue);
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }
    .chart-container {
      height: 300px;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<div class="container">
  <header>
    <h2>工作任务跟踪记录器</h2>
    <div>
      <button id="toggleTheme" class="btn">切换主题</button>
      <button id="logoutBtn" class="btn hidden">退出登录</button>
    </div>
  </header>

  <!-- 登录页面 -->
  <div id="loginPage" class="page card active">
    <h2>登录</h2>
    <input id="loginUser" placeholder="用户名">
    <div class="pwd-box">
      <input id="loginPwd" type="password" placeholder="密码">
      <span class="toggle-pwd" onclick="togglePwd('loginPwd')">👁️</span>
    </div>
    <button class="btn" onclick="login()">登录</button>
    <div class="link" onclick="goPage('findPage')">忘记密码？</div>
    <div class="link" onclick="goPage('regPage')">去注册账号</div>
  </div>

  <!-- 注册页面 -->
  <div id="regPage" class="page card">
    <h2>注册</h2>
    <input id="regUser" placeholder="用户名">
    <div class="pwd-box">
      <input id="regPwd" type="password" placeholder="密码">
      <span class="toggle-pwd" onclick="togglePwd('regPwd')">👁️</span>
    </div>
    <div class="pwd-box">
      <input id="regPwd2" type="password" placeholder="确认密码">
      <span class="toggle-pwd" onclick="togglePwd('regPwd2')">👁️</span>
    </div>
    <select id="question">
      <option>你的生日是？</option>
      <option>你的小学名称是？</option>
      <option>你的母亲姓名是？</option>
    </select>
    <input id="answer" placeholder="答案">
    <button class="btn" onclick="register()">注册</button>
    <div class="link" onclick="goPage('loginPage')">返回登录</div>
  </div>

  <!-- 找回密码 -->
  <div id="findPage" class="page card">
    <h2>找回密码</h2>
    <input id="findUser" placeholder="用户名">
    <select id="findQuestion">
      <option>你的生日是？</option>
      <option>你的小学名称是？</option>
      <option>你的母亲姓名是？</option>
    </select>
    <input id="findAnswer" placeholder="答案">
    <button class="btn" onclick="findPwd()">验证并显示密码</button>
    <div id="showPwd" class="link" style="color:red;"></div>
    <div class="link" onclick="goPage('loginPage')">返回登录</div>
  </div>

  <!-- 主功能 -->
  <div id="mainPage" class="hidden">
    <div class="card">
      <h3>新增任务</h3>
      <input id="no" placeholder="任务序号">
      <input id="name" placeholder="任务名称">
      <input id="start" type="datetime-local">
      <input id="end" type="datetime-local">
      <input id="user" placeholder="对接人">
      <select id="status">
        <option>进行中</option>
        <option>已完成</option>
        <option>待反馈</option>
      </select>
      <button class="btn" onclick="addTask()">保存任务</button>
    </div>

    <div class="card">
      <h3>任务列表</h3>
      <table>
        <thead>
          <tr>
            <th>序号</th><th>任务名称</th><th>开始</th><th>截至</th><th>对接人</th><th>状态</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="taskList"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>月度任务统计</h3>
      <input type="month" id="month" onchange="drawChart()">
      <div class="chart-container">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
  let user = null;
  let users = JSON.parse(localStorage.getItem('users')) || [];
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  let chartInstance = null;

  // 切换页面
  function goPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    showPwd.innerText = '';
  }

  // 密码显示隐藏
  function togglePwd(id) {
    let i = document.getElementById(id);
    i.type = i.type === 'password' ? 'text' : 'password';
  }

  // 切换主题
  toggleTheme.onclick = () => document.body.classList.toggle('dark');

  // 注册
  function register() {
    let u = regUser.value.trim();
    let p = regPwd.value.trim();
    let p2 = regPwd2.value.trim();
    let q = question.value;
    let a = answer.value.trim();

    if (!u || !p || !p2 || !a) return alert('请填完所有项');
    if (p !== p2) return alert('两次密码不一致');
    if (users.find(x => x.user === u)) return alert('用户名已存在');

    users.push({ user: u, pwd: p, question: q, answer: a });
    localStorage.setItem('users', JSON.stringify(users));
    alert('注册成功！');
    goPage('loginPage');
  }

  // 登录
  function login() {
    let u = loginUser.value.trim();
    let p = loginPwd.value.trim();
    let fu = users.find(x => x.user === u && x.pwd === p);
    if (!fu) return alert('账号或密码错误');

    user = u;
    loginPage.classList.add('hidden');
    regPage.classList.add('hidden');
    findPage.classList.add('hidden');
    mainPage.classList.remove('hidden');
    logoutBtn.classList.remove('hidden');
    renderList();
    drawChart();
  }

  // 找回密码
  function findPwd() {
    let u = findUser.value.trim();
    let q = findQuestion.value;
    let a = findAnswer.value.trim();
    let fu = users.find(x => x.user === u && x.question === q && x.answer === a);
    if (!fu) return alert('信息不匹配');
    showPwd.innerText = '你的密码：' + fu.pwd;
  }

  // 退出
  logoutBtn.onclick = () => location.reload();

  // 添加任务
  function addTask() {
    let task = {
      no: no.value,
      name: name.value,
      start: start.value,
      end: end.value,
      user: user.value,
      status: status.value,
      month: new Date().toISOString().slice(0,7)
    };
    tasks.push(task);
    localStorage.setItem('tasks', JSON.stringify(tasks));
    renderList();
    drawChart();
    alert('添加成功');
  }

  // 渲染列表
  function renderList() {
    taskList.innerHTML = '';
    tasks.forEach((t, idx) => {
      taskList.innerHTML += `
      <tr>
        <td>${t.no}</td>
        <td>${t.name}</td>
        <td>${t.start || ''}</td>
        <td>${t.end || ''}</td>
        <td>${t.user}</td>
        <td>${t.status}</td>
        <td><button onclick="del(${idx})">删除</button></td>
      </tr>`;
    });
  }

  // 删除
  function del(idx) {
    if (!confirm('确定删除？')) return;
    tasks.splice(idx, 1);
    localStorage.setItem('tasks', JSON.stringify(tasks));
    renderList();
    drawChart();
  }

  // 图表
  function drawChart() {
    let m = month.value || new Date().toISOString().slice(0,7);
    let list = tasks.filter(t => t.month === m);
    let res = { 进行中:0, 已完成:0, 待反馈:0 };
    list.forEach(t => res[t.status]++);
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(chart, {
      type: 'bar',
      data: {
        labels: ['进行中','已完成','待反馈'],
        datasets: [{ data: [res.进行中, res.已完成, res.待反馈], backgroundColor: ['#f59e0b','#10b981','#3b82f6'] }]
      }
    });
  }
</script>
</body>
</html>
